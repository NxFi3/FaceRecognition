name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FaceRecognition --add-data "yolov8n-face.pt;." --hidden-import ultralytics --collect-all ultralytics --collect-all face_recognition --collect-binaries dlib src/app.py

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/FaceRecognition/* -DestinationPath FaceRecognition-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FaceRecognition-Windows
          path: FaceRecognition-Windows.zip
