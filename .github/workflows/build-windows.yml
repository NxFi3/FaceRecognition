name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download YuNet model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://huggingface.co/opencv/opencv_zoo/resolve/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" -OutFile "face_detection_yunet_2023mar.onnx"
          if ((Get-Item "face_detection_yunet_2023mar.onnx").Length -lt 100000) {
            throw "YuNet model download looks invalid."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          $requirements = Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*face_recognition\s*$' }
          $requirements | Set-Content windows-requirements.txt
          python -m pip install -r windows-requirements.txt
          python -m pip install dlib-bin==20.0.1.post1
          python -m pip install face_recognition_models
          python -m pip install face_recognition --no-deps
          python -m pip install pyinstaller

      - name: Verify Python runtime dependencies
        shell: pwsh
        run: |
          python -c "import cv2, dlib, face_recognition, face_recognition_models, numpy, PySide6; print('PYTHON_RUNTIME_OK')"
          python -c "import cv2; d=cv2.FaceDetectorYN.create('face_detection_yunet_2023mar.onnx','',(1280,720),0.60,0.30,5000); d.setInputSize((1280,720)); print('YUNET_MODEL_LOAD_OK')"

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FaceRecognition --add-data 'face_detection_yunet_2023mar.onnx;.' --hidden-import face_recognition_models --collect-all face_recognition --collect-all face_recognition_models --collect-binaries dlib src/app.py

      - name: Verify packaged files
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/FaceRecognition/FaceRecognition.exe')) {
            throw 'PyInstaller did not produce FaceRecognition.exe.'
          }

          $package = Resolve-Path 'dist/FaceRecognition'
          $model = Get-ChildItem -Path $package -Filter 'face_detection_yunet_2023mar.onnx' -File -Recurse | Select-Object -First 1
          if (-not $model) {
            throw 'YuNet model was not found in the PyInstaller package.'
          }

          $target = Join-Path $package 'face_detection_yunet_2023mar.onnx'
          if ($model.FullName -ne $target) {
            Copy-Item -LiteralPath $model.FullName -Destination $target -Force
          }

          Write-Host "Packaged YuNet model: $target"
          Write-Host "Size: $((Get-Item $target).Length) bytes"

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/FaceRecognition/FaceRecognition.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          if (Test-Path 'FaceRecognition-Windows.zip') {
            Remove-Item 'FaceRecognition-Windows.zip' -Force
          }
          Compress-Archive -Path 'dist/FaceRecognition/*' -DestinationPath 'FaceRecognition-Windows.zip'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FaceRecognition-Windows
          path: FaceRecognition-Windows.zip
