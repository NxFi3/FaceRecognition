services:
  db:
    image: face-subscription-postgres:17
    build:
      context: ..
      dockerfile: deploy/Postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: face_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run deploy.configure}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?run deploy.configure}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d face_service']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction, --appendonly, 'yes']
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://face_service:${POSTGRES_PASSWORD}@db:5432/face_service
      REDIS_URL: redis://redis:6379/0
      BACKUP_ROOT: /data/backups
      RELEASE_ROOT: /data/releases
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - backup_data:/data/backups
      - ./releases:/data/releases:ro
    tmpfs: ['/tmp:rw,noexec,nosuid,size=512m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':__import__('urllib.parse',fromlist=['urlparse']).urlparse(__import__('os').environ['PUBLIC_URL']).hostname,'X-Forwarded-Proto':'https'}),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [internal, edge]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [web]
    networks: [edge]
networks:
  internal: {internal: true}
  edge: {}
volumes:
  postgres_data: {}
  redis_data: {}
  backup_data: {}
  caddy_data: {}
  caddy_config: {}
